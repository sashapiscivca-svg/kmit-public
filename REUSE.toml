# Path-to-licence mapping for Kmit (REUSE specification 3.3, https://reuse.software).
# When several annotations match a file, the last matching one applies.
# Human-readable explanation: LICENSE-CONTENT.md and NOTICE.
version = 1
SPDX-PackageName = "Kmit"
SPDX-PackageSupplier = "Oleksandr Shynkarenko <sasha.piscivca@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/sashapiscivca-svg/kmit"

# Default: everything is software under PolyForm Noncommercial 1.0.0.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Oleksandr Shynkarenko <sasha.piscivca@gmail.com>"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

# Learning content, documentation and the project site: CC BY-NC-SA 4.0.
[[annotations]]
path = [
  "crates/subjects/packs/**",
  "docs/**",
  "site/**",
  "README.md",
  "README.uk.md",
  "BUILDING.md",
  "BUILDING.uk.md",
  "ARCHITECTURE.md",
  "CHANGELOG.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Oleksandr Shynkarenko <sasha.piscivca@gmail.com>"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# Fonts (unmodified upstream files) and their licence files.
[[annotations]]
path = ["app/ui/fonts/Manrope-*.ttf", "crates/report/assets/Manrope-*.ttf", "app/ui/fonts/OFL-Manrope.txt", "crates/report/assets/OFL-Manrope.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2018 The Manrope Project Authors (https://github.com/sharanda/manrope)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["app/ui/fonts/Caveat-*.ttf", "crates/report/assets/Caveat-*.ttf", "app/ui/fonts/OFL-Caveat.txt", "crates/report/assets/OFL-Caveat.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014 The Caveat Project Authors (https://github.com/googlefonts/caveat)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["crates/report/assets/LiberationSans-*.ttf", "crates/report/assets/LICENSE-LiberationSans.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2010 Google Corporation (digitized data, Reserved Font Names Arimo, Tinos, Cousine)",
  "2012 Red Hat, Inc. (Reserved Font Name Liberation)",
]
SPDX-License-Identifier = "OFL-1.1"

# Android project generated by the Tauri CLI from its templates (MIT OR Apache-2.0), with Kmit changes.
[[annotations]]
path = "app/src-tauri/gen/android/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "Tauri Programme within The Commons Conservancy",
  "2026 Oleksandr Shynkarenko <sasha.piscivca@gmail.com>",
]
SPDX-License-Identifier = "(MIT OR Apache-2.0) AND PolyForm-Noncommercial-1.0.0"

# Kmit's own Android code and launcher icons.
[[annotations]]
path = [
  "app/src-tauri/gen/android/app/src/main/java/ua/kmit/tutor/FilesPlugin.kt",
  "app/src-tauri/gen/android/app/src/main/res/mipmap-*/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Oleksandr Shynkarenko <sasha.piscivca@gmail.com>"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

# Gradle wrapper.
[[annotations]]
path = ["app/src-tauri/gen/android/gradlew", "app/src-tauri/gen/android/gradlew.bat", "app/src-tauri/gen/android/gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors (Gradle)"
SPDX-License-Identifier = "Apache-2.0"

# Third-party licence and notice texts collected for the in-app licence screen.
[[annotations]]
path = ["scripts/third_party/*.txt", "app/ui/licenses.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The respective third-party authors named in each file"
SPDX-License-Identifier = "LicenseRef-third-party-notices"

# Developer Certificate of Origin (verbatim copying allowed, changes not allowed).
[[annotations]]
path = "DCO"
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO"
