[package]
name = "kmit-app"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.80"
authors = ["Oleksandr Shynkarenko <sasha.piscivca@gmail.com>"]
repository = "https://github.com/sashapiscivca-svg/kmit"
publish = false

# Окремий робочий простір: мобільна збірка (Tauri) має власний Cargo.lock і не змішується з крейтами ядра.
[workspace]

# Захист ключа профілю в Android Keystore. Вимкнено за замовчуванням: не перевірено на пристрої (Q25);
# помилка тут могла б зробити профіль недоступним. Вмикати лише після перевірки на справжніх телефонах.
[features]
keystore = []
reviewer = ["app-core/reviewer"]

[lib]
name = "kmit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
app-core = { path = "../../crates/app-core" }
storage = { path = "../../crates/storage" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
