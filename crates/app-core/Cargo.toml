[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Лише для тестів: дозволяє тесту «підгледіти» відповідь, щоб пройти шлях дитини. У релізі вимкнено.
test-support = ["tutor-core/test-support"]
# Окрема збірка для методистів (поза Google Play): лише вичитка вмісту, без дитячих профілів, робіт і планів.
reviewer = []

[dependencies]
tutor-core = { path = "../tutor-core" }
tutor-engine = { path = "../tutor-engine" }
course-pack = { path = "../course-pack" }
generators-math = { path = "../generators-math" }
subjects = { path = "../subjects" }
storage = { path = "../storage" }
report = { path = "../report" }
content-tools = { path = "../content-tools", default-features = false }
serde_json = "1"

[dev-dependencies]
content-tools = { path = "../content-tools", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde_json = "1"
storage = { path = "../storage", features = ["test-params"] }
getrandom = "0.2"
app-core = { path = ".", features = ["test-support"] }
