[package]
name = "dev-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Швидкі (слабкі) параметри Argon2 лише для автоматичних перевірок інтерфейсу.
fast-kdf = ["storage/test-params"]
# Лише для автоматичного наскрізного тесту: сервер віддає відповідь поточної задачі (/__peek). Ніколи не вмикати для людей.
reviewer = ["app-core/reviewer"]
e2e = ["fast-kdf", "app-core/test-support"]

[dependencies]
app-core = { path = "../app-core" }
storage = { path = "../storage" }
serde_json = "1"
